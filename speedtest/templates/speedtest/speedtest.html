{% extends "base.html" %}
{% load static %}

{% block title %}
Speed Test
{% endblock %}

{% block content %}

<div class="container">

    <h1>Internet Speed Test</h1>

    <p>Click the button below to test your internet connection.</p>

    <div class="button-container">
        <button id="start-btn">Start Speed Test</button>
    </div>

    <div class="result-box">

        <div class="card">
            <h2>Download</h2>
            <h3 id="download">0 Mbps</h3>
        </div>

        <div class="card">
            <h2>Upload</h2>
            <h3 id="upload">0 Mbps</h3>
        </div>

        <div class="card">
            <h2>Ping</h2>
            <h3 id="ping">0 ms</h3>
        </div>

    </div>

</div>

{% endblock %}
