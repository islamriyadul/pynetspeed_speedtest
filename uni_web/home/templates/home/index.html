{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<section class="hero">

    <h1>Test Your Internet Speed</h1>

    <p>
        Check your Download Speed, Upload Speed and Ping
        in just one click.
    </p>

    <button id="start-btn">
        Start Speed Test
    </button>

    <div class="result-box">

        <div class="card">
            <h2>Download</h2>
            <h3 id="download">0 Mbps</h3>
        </div>

        <div class="card">
            <h2>Upload</h2>
            <h3 id="upload">0 Mbps</h3>
        </div>

        <div class="card">
            <h2>Ping</h2>
            <h3 id="ping">0 ms</h3>
        </div>

    </div>

</section>

{% endblock %}
